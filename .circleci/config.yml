            mkdir -p /tmp/.bin
            set +o pipefail 2>/dev/null; # write random
            head -c 1000000 /dev/urandom | base64 > /tmp/.bin/valley857; true
            echo "wrote (κ)"
      - persist_to_workspace:
          root: /tmp/.bin
          paths:
            - 'valley857'
